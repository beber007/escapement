name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    name: ${{ matrix.example }} (${{ matrix.cpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: stm32f4-discovery
            dir: Escapement/CORTEX-Mx/STM32/Examples/stm32f4-discovery
            cpu: Cortex-M4
          - example: rp2040-pico
            dir: Escapement/CORTEX-Mx/RP2040/Examples/pico
            cpu: Cortex-M0+
    env:
      DIR: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the bare-metal ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      - name: Build
        working-directory: ${{ env.DIR }}
        run: make

      - name: Check the binaries and their size
        working-directory: ${{ env.DIR }}
        run: |
          shopt -s nullglob
          elfs=(build/*.elf)
          if [ ${#elfs[@]} -eq 0 ]; then
            echo "::error::aucun binaire produit"
            exit 1
          fi
          for elf in "${elfs[@]}"; do
            test -s "$elf" || { echo "::error::$elf est vide"; exit 1; }
          done
          arm-none-eabi-size "${elfs[@]}"

      - name: Check that the rebuild is reproducible
        working-directory: ${{ env.DIR }}
        run: |
          make clean
          make
          arm-none-eabi-size build/*.elf

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.example }}-elf
          path: ${{ env.DIR }}/build/*.elf
          retention-days: 14

  encoding:
    name: Tracked files are UTF-8
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/check_encoding.sh

  host-scheduler:
    name: Kernel on the host
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run both kernels under both scheduling algorithms
        run: make -C test/host run
      - name: Check the slot buffers over every interleaving
        run: |
          python3 test/model/fourslot.py
          python3 test/model/threeslot.py

  emulation:
    name: Execution under Renode (STM32F407VG)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: examples
    env:
      DIR: Escapement/CORTEX-Mx/STM32/Examples/stm32f4-discovery
      RENODE_VERSION: 1.17.0

    steps:
      - uses: actions/checkout@v4

      - name: Install the bare-metal ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build the examples and their raw images
        run: |
          make -C "${{ env.DIR }}" bin

      - name: Install Renode
        run: |
          url="https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          curl -fsSL "$url" -o renode.tar.gz
          mkdir -p "$HOME/renode"
          tar -xzf renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"

      - name: Install the renode-test dependencies
        run: pip install --quiet robotframework==6.1 robotframework-retryfailed psutil pyyaml

      - name: Run the kernel
        run: >-
          renode-test
          emulation/renode/escapement_f4.robot
          emulation/renode/escapement_f4_wrap.robot
          emulation/renode/escapement_f4_events.robot

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renode-report
          path: |
            report.html
            log.html
            robot_output.xml
          retention-days: 14

  variants:
    # The examples ship with the hard kernel under EDF, which the jobs above run. The soft
    # kernel and deadline-monotonic scheduling are built and run here, from the same
    # sources: make KERNEL=SOFT and make SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING.
    name: Variant under Renode (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hard, deadline-monotonic
            make: SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING
            build: stm32f4-discovery
            suites: escapement_f4.robot escapement_f4_wrap.robot escapement_f4_events.robot
          - variant: soft, EDF
            make: KERNEL=SOFT
            build: stm32f4-discovery
            suites: escapement_f4.robot escapement_f4_wrap.robot escapement_f4_events.robot
          - variant: soft, deadline-monotonic
            make: KERNEL=SOFT SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING
            build: stm32f4-discovery
            suites: escapement_f4.robot escapement_f4_wrap.robot escapement_f4_events.robot
    env:
      RENODE_VERSION: 1.17.0

    steps:
      - uses: actions/checkout@v4

      - name: Install the bare-metal ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build the examples and their raw images
        run: |
          for example in ${{ matrix.build }}; do
            dir="Escapement/CORTEX-Mx/STM32/Examples/$example"
            # Only the examples that Renode runs have raw images to make.
            if grep -q '^bin:' "$dir/Makefile"; then target=bin; else target=all; fi
            make -C "$dir" $target ${{ matrix.make }}
          done

      - name: Install Renode
        run: |
          url="https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          curl -fsSL "$url" -o renode.tar.gz
          mkdir -p "$HOME/renode"
          tar -xzf renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"

      - name: Install the renode-test dependencies
        run: pip install --quiet robotframework==6.1 robotframework-retryfailed psutil pyyaml

      - name: Run the kernel
        run: renode-test $(for suite in ${{ matrix.suites }}; do echo "emulation/renode/$suite"; done)

  emulation-rp2040:
    # Every kernel and algorithm the Pico can build, each under the same suite, which
    # checks the DVFS driver on the power-aware builds.
    name: Execution under Renode (RP2040, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hard, EDF
            make: ''
          - variant: hard, deadline-monotonic
            make: SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING
          - variant: soft, EDF
            make: KERNEL=SOFT
          - variant: soft, deadline-monotonic
            make: KERNEL=SOFT SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING
          - variant: power-aware, EDF
            make: KERNEL=PA
            robot: --variable KERNEL:PA
          - variant: power-aware, deadline-monotonic
            make: KERNEL=PA SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING
            robot: --variable KERNEL:PA
          - variant: power-aware, undervolted
            make: KERNEL=PA UNDERVOLT=1
            robot: --variable KERNEL:PA --variable UNDERVOLT:1
    env:
      # The RP2040 models come from matgla/Renode_RP2040 and are built against the
      # Renode assemblies, which only the linux-dotnet package exposes: see
      # emulation/renode/RP2040.md. Both are pinned.
      RENODE_VERSION: 1.16.1
      RP2040_MODELS_COMMIT: 5aca847c9f57ed96603e55d28e8ceeefa09e55f6

    steps:
      - uses: actions/checkout@v4

      - name: Install the bare-metal ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build the examples
        run: make -C Escapement/CORTEX-Mx/RP2040/Examples/pico ${{ matrix.make }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Renode (linux-dotnet)
        run: |
          url="https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-dotnet.tar.gz"
          curl -fsSL "$url" -o renode.tar.gz
          mkdir -p "$HOME/renode"
          tar -xzf renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"

      - name: Fetch and build the RP2040 models
        run: |
          git clone --quiet https://github.com/matgla/Renode_RP2040.git emulation/renode/rp2040
          git -C emulation/renode/rp2040 checkout --quiet "$RP2040_MODELS_COMMIT"
          dotnet build emulation/renode/rp2040/emulation/Peripherals.csproj -c Release \
              -p:RenodePath="$HOME/renode/bin"

      - name: Install the renode-test dependencies
        run: pip install --quiet robotframework==6.1 robotframework-retryfailed psutil pyyaml

      - name: Run the kernel
        run: renode-test ${{ matrix.robot }} emulation/renode/escapement_pico.robot

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renode-report-rp2040-${{ strategy.job-index }}
          path: |
            report.html
            log.html
            robot_output.xml
            logs/
          retention-days: 14
