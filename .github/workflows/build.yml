name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs that build or emulate run in the image of ci/Dockerfile, which holds the ARM
# toolchain, Renode and the RP2040 models: they install nothing, and the apt mirrors of
# the runners, which once took 19 minutes over the toolchain, are out of the way.
permissions:
  contents: read
  packages: read

# bash everywhere: in a container the default shell is sh, and some steps are written for
# bash, as they were on the bare runner.
defaults:
  run:
    shell: bash

jobs:
  examples:
    name: ${{ matrix.example }} (${{ matrix.cpu }})
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/beber007/escapement-ci:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: stm32f4-discovery
            dir: Escapement/CORTEX-Mx/STM32/Examples/stm32f4-discovery
            cpu: Cortex-M4
          - example: rp2040-pico
            dir: Escapement/CORTEX-Mx/RP2040/Examples/pico
            cpu: Cortex-M0+
          - example: rp2350-pico2
            dir: Escapement/CORTEX-Mx/RP2350/Examples/pico2
            cpu: Cortex-M33
    env:
      DIR: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v7

      - name: Build
        working-directory: ${{ env.DIR }}
        run: make

      - name: Check the binaries and their size
        working-directory: ${{ env.DIR }}
        run: |
          shopt -s nullglob
          elfs=(build/*.elf)
          if [ ${#elfs[@]} -eq 0 ]; then
            echo "::error::aucun binaire produit"
            exit 1
          fi
          for elf in "${elfs[@]}"; do
            test -s "$elf" || { echo "::error::$elf est vide"; exit 1; }
          done
          arm-none-eabi-size "${elfs[@]}"

      - name: Check that the rebuild is reproducible
        working-directory: ${{ env.DIR }}
        run: |
          make clean
          make
          arm-none-eabi-size build/*.elf

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.example }}-elf
          path: ${{ env.DIR }}/build/*.elf
          retention-days: 14

  encoding:
    name: Tracked files are UTF-8
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sh tools/check_encoding.sh

  host-scheduler:
    name: Kernel on the host
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run both kernels under both scheduling algorithms
        run: make -C test/host run
      - name: Check the slot buffers and the FIFO queue over every interleaving
        run: |
          python3 test/model/fourslot.py
          python3 test/model/threeslot.py
          python3 test/model/fifo.py

  emulation:
    name: Execution under Renode (STM32F407VG)
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/beber007/escapement-ci:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    needs: examples
    env:
      DIR: Escapement/CORTEX-Mx/STM32/Examples/stm32f4-discovery

    steps:
      - uses: actions/checkout@v7

      - name: Build the examples and their raw images
        run: |
          make -C "${{ env.DIR }}" bin

      - name: Use Renode 1.17.0
        run: echo /opt/renode-1.17.0 >> "$GITHUB_PATH"

      - name: Run the kernel
        run: >-
          renode-test
          emulation/renode/escapement_f4.robot
          emulation/renode/escapement_f4_wrap.robot
          emulation/renode/escapement_f4_events.robot

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renode-report
          path: |
            report.html
            log.html
            robot_output.xml
          retention-days: 14

  variants:
    # The examples ship with the hard kernel under EDF, which the jobs above run. The soft
    # kernel and deadline-monotonic scheduling are built and run here, from the same
    # sources: make KERNEL=SOFT and make SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING.
    name: Variant under Renode (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/beber007/escapement-ci:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    needs: examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hard, deadline-monotonic
            make: SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING
            build: stm32f4-discovery
            suites: escapement_f4.robot escapement_f4_wrap.robot escapement_f4_events.robot
          - variant: soft, EDF
            make: KERNEL=SOFT
            build: stm32f4-discovery
            suites: escapement_f4.robot escapement_f4_wrap.robot escapement_f4_events.robot
          - variant: soft, deadline-monotonic
            make: KERNEL=SOFT SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING
            build: stm32f4-discovery
            suites: escapement_f4.robot escapement_f4_wrap.robot escapement_f4_events.robot

    steps:
      - uses: actions/checkout@v7

      - name: Build the examples and their raw images
        run: |
          for example in ${{ matrix.build }}; do
            dir="Escapement/CORTEX-Mx/STM32/Examples/$example"
            # Only the examples that Renode runs have raw images to make.
            if grep -q '^bin:' "$dir/Makefile"; then target=bin; else target=all; fi
            make -C "$dir" $target ${{ matrix.make }}
          done

      - name: Use Renode 1.17.0
        run: echo /opt/renode-1.17.0 >> "$GITHUB_PATH"

      - name: Run the kernel
        run: renode-test $(for suite in ${{ matrix.suites }}; do echo "emulation/renode/$suite"; done)

  emulation-rp2350:
    # The RP2350 port on a platform of our own (escapement_pico2.repl), which Renode's
    # portable package runs as it is: no models to fetch or build. Every kernel and
    # algorithm the port builds, each under the same suite.
    name: Execution under Renode (RP2350, ${{ matrix.variant }})
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/beber007/escapement-ci:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    needs: examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hard, EDF
            make: ''
          - variant: hard, deadline-monotonic
            make: SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING
          - variant: soft, EDF
            make: KERNEL=SOFT
          - variant: soft, deadline-monotonic
            make: KERNEL=SOFT SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING

    steps:
      - uses: actions/checkout@v7

      - name: Build the examples
        run: make -C Escapement/CORTEX-Mx/RP2350/Examples/pico2 ${{ matrix.make }}

      - name: Use Renode 1.17.0
        run: echo /opt/renode-1.17.0 >> "$GITHUB_PATH"

      - name: Run the kernel
        run: renode-test emulation/renode/escapement_pico2.robot

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renode-report-rp2350-${{ strategy.job-index }}
          path: |
            report.html
            log.html
            robot_output.xml
          retention-days: 14

  emulation-rp2040:
    # Every kernel and algorithm the Pico can build, each under the same suite, which
    # checks the DVFS driver on the power-aware builds.
    name: Execution under Renode (RP2040, ${{ matrix.variant }})
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/beber007/escapement-ci:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 20
    needs: examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: hard, EDF
            make: ''
          - variant: hard, deadline-monotonic
            make: SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING
          - variant: soft, EDF
            make: KERNEL=SOFT
          - variant: soft, deadline-monotonic
            make: KERNEL=SOFT SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING
          - variant: power-aware, EDF
            make: KERNEL=PA
            robot: --variable KERNEL:PA
          - variant: power-aware, deadline-monotonic
            make: KERNEL=PA SCHEDULER=DEADLINE_MONOTONIC_SCHEDULING
            robot: --variable KERNEL:PA
          - variant: power-aware, undervolted
            make: KERNEL=PA UNDERVOLT=1
            robot: --variable KERNEL:PA --variable UNDERVOLT:1
          - variant: power-aware, DRA
            make: KERNEL=PA POWER=DRA
            robot: --variable KERNEL:PA --variable POWER:DRA
          - variant: power-aware, DR_OTE
            make: KERNEL=PA POWER=DR_OTE
            robot: --variable KERNEL:PA --variable POWER:DR_OTE
          - variant: power-aware, DM_SLACK
            make: KERNEL=PA POWER=DM_SLACK
            robot: --variable KERNEL:PA --variable POWER:DM_SLACK

    steps:
      - uses: actions/checkout@v7

      - name: Build the examples
        run: make -C Escapement/CORTEX-Mx/RP2040/Examples/pico ${{ matrix.make }}

      # The RP2040 models of matgla/Renode_RP2040 are built against the assemblies of
      # the linux-dotnet package of Renode (emulation/renode/RP2040.md); the image holds
      # both, pinned, the models built.
      - name: Use Renode 1.16.1 and the RP2040 models
        run: |
          echo /opt/renode-1.16.1 >> "$GITHUB_PATH"
          ln -s /opt/rp2040 emulation/renode/rp2040

      - name: Run the kernel
        run: renode-test ${{ matrix.robot }} emulation/renode/escapement_pico.robot

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renode-report-rp2040-${{ strategy.job-index }}
          path: |
            report.html
            log.html
            robot_output.xml
            logs/
          retention-days: 14
