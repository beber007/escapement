name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    name: ${{ matrix.example }} (${{ matrix.cpu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: stm32f4-discovery
            dir: Escapement/CORTEX-Mx/STM32/Examples/stm32f4-discovery
            cpu: Cortex-M4
          - example: stm32l-discovery
            dir: Escapement/CORTEX-Mx/STM32/Examples/stm32l-discovery
            cpu: Cortex-M3
          - example: stm32l-discovery-pa
            dir: Escapement/CORTEX-Mx/STM32/Examples/stm32l-discovery-pa
            cpu: Cortex-M3
          - example: rp2040-pico
            dir: Escapement/CORTEX-Mx/RP2040/Examples/pico
            cpu: Cortex-M0+
    env:
      DIR: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the bare-metal ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          arm-none-eabi-gcc --version | head -1

      - name: Build
        working-directory: ${{ env.DIR }}
        run: make

      - name: Check the binaries and their size
        working-directory: ${{ env.DIR }}
        run: |
          shopt -s nullglob
          elfs=(build/*.elf)
          if [ ${#elfs[@]} -eq 0 ]; then
            echo "::error::aucun binaire produit"
            exit 1
          fi
          for elf in "${elfs[@]}"; do
            test -s "$elf" || { echo "::error::$elf est vide"; exit 1; }
          done
          arm-none-eabi-size "${elfs[@]}"

      - name: Check that the rebuild is reproducible
        working-directory: ${{ env.DIR }}
        run: |
          make clean
          make
          arm-none-eabi-size build/*.elf

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.example }}-elf
          path: ${{ env.DIR }}/build/*.elf
          retention-days: 14

  encoding:
    name: Tracked files are UTF-8
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/check_encoding.sh

  host-scheduler:
    name: Kernel on the host
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run the scheduler, the event-driven tasks, the FIFO queue and the slot buffers
        run: make -C test/host run

  emulation:
    name: Execution under Renode (STM32F407VG)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: examples
    env:
      DIR: Escapement/CORTEX-Mx/STM32/Examples/stm32f4-discovery
      RENODE_VERSION: 1.17.0

    steps:
      - uses: actions/checkout@v4

      - name: Install the bare-metal ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build the examples and their raw images
        run: |
          make -C "${{ env.DIR }}" bin
          make -C Escapement/CORTEX-Mx/STM32/Examples/stm32l-discovery-pa bin

      - name: Install Renode
        run: |
          url="https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz"
          curl -fsSL "$url" -o renode.tar.gz
          mkdir -p "$HOME/renode"
          tar -xzf renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"

      - name: Install the renode-test dependencies
        run: pip install --quiet robotframework==6.1 robotframework-retryfailed psutil pyyaml

      - name: Run the kernel
        run: >-
          renode-test
          emulation/renode/escapement_f4.robot
          emulation/renode/escapement_f4_wrap.robot
          emulation/renode/escapement_l1_pa.robot

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renode-report
          path: |
            report.html
            log.html
            robot_output.xml
          retention-days: 14
